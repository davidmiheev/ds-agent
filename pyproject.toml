[project]
name = "ds-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.144",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.0.1",
]

# Virtual project: sources live in src/ and are imported via PYTHONPATH=src
# (scripts/run_server.sh sets this). Not installed as a package.
[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
